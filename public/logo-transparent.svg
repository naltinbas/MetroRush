<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="Metro Rush">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1030"/>
      <stop offset="1" stop-color="#1a0f33"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1f5c"/>
      <stop offset="1" stop-color="#171236"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6a4a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff6a4a" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="glowSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="glowText" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="0.42"/>
    </filter>
    <clipPath id="badge"><rect x="40" y="50" width="300" height="300" rx="36"/></clipPath>
    <!-- Stroke letterforms on a 4 x 7 grid. -->
    <path id="M" d="M0,7 L0,0 L2,3.2 L4,0 L4,7"/>
    <path id="E" d="M4,0 L0,0 L0,7 L4,7 M0,3.5 L3,3.5"/>
    <path id="T" d="M0,0 L4,0 M2,0 L2,7"/>
    <path id="R" d="M0,7 L0,0 L2.4,0 A1.75,1.75 0 0 1 2.4,3.5 L0,3.5 M2.1,3.5 L4,7"/>
    <path id="O" d="M0,2 A2,2 0 0 1 4,2 L4,5 A2,2 0 0 1 0,5 Z"/>
    <path id="U" d="M0,0 L0,5 A2,2 0 0 0 4,5 L4,0"/>
    <path id="S" d="M3.7,1.35 A1.8,1.8 0 1 0 2,3.5 A1.8,1.8 0 1 1 0.3,5.65"/>
    <path id="H" d="M0,0 L0,7 M4,0 L4,7 M0,3.5 L4,3.5"/>
  </defs>


  <!-- Badge: skyrail in perspective with the courier. -->
  <g clip-path="url(#badge)">
    <rect x="40" y="50" width="300" height="300" fill="#090b22"/>
    <rect x="40" y="50" width="300" height="150" fill="url(#sky)"/>
    <!-- distant blocks -->
    <g fill="#141838">
      <rect x="40" y="120" width="52" height="120"/>
      <rect x="98" y="150" width="34" height="90"/>
      <rect x="246" y="140" width="40" height="100"/>
      <rect x="292" y="110" width="48" height="130"/>
    </g>
    <g fill="#ffd447" opacity="0.55">
      <rect x="50" y="132" width="6" height="6"/><rect x="66" y="150" width="6" height="6"/><rect x="76" y="176" width="6" height="6"/>
      <rect x="106" y="162" width="5" height="5"/><rect x="118" y="190" width="5" height="5"/>
      <rect x="256" y="152" width="6" height="6"/><rect x="272" y="178" width="6" height="6"/>
      <rect x="302" y="124" width="6" height="6"/><rect x="322" y="150" width="6" height="6"/><rect x="310" y="184" width="6" height="6"/>
    </g>
    <!-- deck -->
    <polygon points="20,350 360,350 240,170 140,170" fill="url(#deck)"/>
    <polygon points="20,350 360,350 240,170 140,170" fill="none" stroke="#ffb24a" stroke-width="3" opacity="0.6"/>
    <!-- lane strips -->
    <g stroke="#35f0ff" stroke-width="4" stroke-linecap="round" fill="none">
      <g filter="url(#glowSoft)" opacity="0.9">
        <line x1="76" y1="350" x2="165" y2="172"/>
        <line x1="190" y1="350" x2="190" y2="172"/>
        <line x1="304" y1="350" x2="215" y2="172"/>
      </g>
      <line x1="76" y1="350" x2="165" y2="172"/>
      <line x1="190" y1="350" x2="190" y2="172"/>
      <line x1="304" y1="350" x2="215" y2="172"/>
    </g>
    <!-- speed streaks -->
    <g stroke="#7ff6ff" stroke-width="5" stroke-linecap="round" opacity="0.7">
      <line x1="112" y1="236" x2="146" y2="236"/>
      <line x1="98" y1="256" x2="140" y2="256"/>
      <line x1="118" y1="276" x2="150" y2="276"/>
    </g>
    <!-- courier -->
    <g transform="translate(206 250) rotate(-8)">
      <g filter="url(#glowSoft)" opacity="0.6" fill="#ff3fa4" stroke="#ff3fa4" stroke-width="14" stroke-linecap="round">
        <circle cx="0" cy="-58" r="17"/>
        <rect x="-19" y="-38" width="38" height="58" rx="14"/>
        <line x1="-8" y1="20" x2="-28" y2="58"/>
        <line x1="10" y1="20" x2="30" y2="46"/>
        <line x1="-18" y1="-24" x2="-42" y2="-4"/>
        <line x1="18" y1="-24" x2="40" y2="-40"/>
      </g>
      <g fill="#ff3fa4" stroke="#ff3fa4" stroke-width="14" stroke-linecap="round">
        <circle cx="0" cy="-58" r="17" stroke="none"/>
        <rect x="-19" y="-38" width="38" height="58" rx="14" stroke="none"/>
        <line x1="-8" y1="20" x2="-28" y2="58"/>
        <line x1="10" y1="20" x2="30" y2="46"/>
        <line x1="-18" y1="-24" x2="-42" y2="-4"/>
        <line x1="18" y1="-24" x2="40" y2="-40"/>
      </g>
      <rect x="-12" y="-66" width="24" height="7" rx="3" fill="#35f0ff"/>
      <rect x="-10" y="-30" width="20" height="8" rx="3" fill="#ffffff" opacity="0.85"/>
    </g>
  </g>
  <rect x="40" y="50" width="300" height="300" rx="36" fill="none" stroke="#35f0ff" stroke-width="3" opacity="0.6"/>

  <!-- METRO -->
  <g transform="translate(392 72) scale(18)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#35f0ff" stroke-width="1.15" opacity="0.65" filter="url(#glowText)">
      <use href="#M"/><use href="#E" transform="translate(5.6 0)"/><use href="#T" transform="translate(11.2 0)"/><use href="#R" transform="translate(16.8 0)"/><use href="#O" transform="translate(22.4 0)"/>
    </g>
    <g stroke="#7ff6ff" stroke-width="1.15">
      <use href="#M"/><use href="#E" transform="translate(5.6 0)"/><use href="#T" transform="translate(11.2 0)"/><use href="#R" transform="translate(16.8 0)"/><use href="#O" transform="translate(22.4 0)"/>
    </g>
  </g>
  <!-- RUSH -->
  <g transform="translate(392 214) scale(18)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#ff3fa4" stroke-width="1.15" opacity="0.65" filter="url(#glowText)">
      <use href="#R"/><use href="#U" transform="translate(5.6 0)"/><use href="#S" transform="translate(11.2 0)"/><use href="#H" transform="translate(16.8 0)"/>
    </g>
    <g stroke="#ff7ac2" stroke-width="1.15">
      <use href="#R"/><use href="#U" transform="translate(5.6 0)"/><use href="#S" transform="translate(11.2 0)"/><use href="#H" transform="translate(16.8 0)"/>
    </g>
  </g>
  <!-- tagline rail -->
  <line x1="392" y1="366" x2="912" y2="366" stroke="#ffd447" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <g fill="#ffd447" opacity="0.7">
    <rect x="392" y="358" width="8" height="8" rx="2"/><rect x="908" y="358" width="8" height="8" rx="2"/>
  </g>
</svg>
